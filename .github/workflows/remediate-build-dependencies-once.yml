name: Remediate build dependencies once

on:
  push:
    branches: [architecture/fototo-next]
    paths:
      - .github/workflows/remediate-build-dependencies-once.yml

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: architecture/fototo-next
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - name: Update build toolchain and remove unused updater
        run: |
          npm pkg set 'devDependencies.electron-builder=^26.18.1'
          npm pkg set 'overrides.minimatch=11.0.1'
          npm pkg delete 'dependencies.electron-updater'
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install exact lockfile
        run: npm ci
      - name: Verify dependency graph
        run: |
          npm ls electron-builder minimatch electron-updater --all || test "$?" -eq 1
          node -e "
            const p=require('./package.json');
            if(p.dependencies?.['electron-updater']) throw new Error('electron-updater is still a direct dependency');
            if(p.overrides?.minimatch!=='11.0.1') throw new Error('minimatch override missing');
            console.log('electron-builder:',p.devDependencies['electron-builder']);
            console.log('minimatch override:',p.overrides.minimatch);
          "
      - name: Report remaining npm vulnerabilities
        shell: bash
        run: |
          npm audit --json > "$RUNNER_TEMP/npm-audit.json" || true
          node -e '
            const fs = require("node:fs");
            const report = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            for (const [name, item] of Object.entries(report.vulnerabilities || {})) {
              const via = (item.via || []).map(v => typeof v === "string" ? v : v.title).join("; ");
              console.log(`${item.severity.toUpperCase()} ${name}@${item.range} direct=${item.isDirect} fix=${JSON.stringify(item.fixAvailable)} advisories=${via}`);
            }
            console.log("Audit totals: " + JSON.stringify(report.metadata?.vulnerabilities || {}));
          ' "$RUNNER_TEMP/npm-audit.json"
      - name: Typecheck and tests
        run: |
          npm run typecheck
          npm test
      - name: Build and package
        run: |
          npm run build
          npm run dist:dir
      - name: Check patch formatting
        run: git diff --check
      - name: Commit verified dependency remediation and remove this workflow
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/remediate-build-dependencies-once.yml
          git add package.json package-lock.json
          git commit -m "security: harden build dependency tree"
          AUTH="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:architecture/fototo-next
