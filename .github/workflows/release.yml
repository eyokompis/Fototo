name: Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: Existing semantic-version tag on main (for example v0.3.0)
        required: true
        type: string

permissions: {}

concurrency:
  group: release-${{ inputs.tag_name }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Check out trusted workflow source
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate tag and check out its commit
        shell: bash
        env:
          TAG_NAME: ${{ inputs.tag_name }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag must use vMAJOR.MINOR.PATCH format"
            exit 1
          fi

          git fetch --force origin main --tags
          if ! git show-ref --verify --quiet "refs/tags/$TAG_NAME"; then
            echo "::error::Tag does not exist in this repository"
            exit 1
          fi

          TAG_COMMIT="$(git rev-parse "refs/tags/$TAG_NAME^{commit}")"
          if ! git merge-base --is-ancestor "$TAG_COMMIT" origin/main; then
            echo "::error::Release tag must point to a commit reachable from main"
            exit 1
          fi

          git checkout --detach "$TAG_COMMIT"
          VERSION="${TAG_NAME#v}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run dist -- --publish never

      - name: Upload platform build artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
          if-no-files-found: error
          retention-days: 7

  draft-release:
    if: github.ref == 'refs/heads/main'
    needs: build
    permissions:
      actions: read
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Refuse to overwrite an existing release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ inputs.tag_name }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "::error::A release for $TAG_NAME already exists; refusing to replace it"
            exit 1
          fi

      - name: Download platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Create draft release for manual review
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name }}
          name: ${{ inputs.tag_name }}
          draft: true
          prerelease: false
          fail_on_unmatched_files: true
          files: release-assets/**/*
          generate_release_notes: true
