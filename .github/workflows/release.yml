name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  verify-release-ref:
    name: Verify release tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require a valid version tag on main
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tag must use semantic version format, for example v1.2.3."
            exit 1
          fi
          git fetch origin main --no-tags
          git cat-file -e "$GITHUB_SHA^{commit}"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Release tags must point to a commit reachable from main."
            exit 1
          fi
          echo "Verified $GITHUB_REF_NAME points to a commit reachable from main."

  release:
    needs: verify-release-ref
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm version ${GITHUB_REF_NAME#v} --no-git-tag-version --allow-same-version
        shell: bash
      - run: npm ci
      - run: npm run dist -- --publish never
      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.blockmap
            release/latest.yml
            release/latest-linux.yml
            release/latest-mac.yml
          generate_release_notes: true
