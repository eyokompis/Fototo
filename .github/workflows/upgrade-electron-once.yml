name: One-time Electron security upgrade

on:
  push:
    branches: [architecture/fototo-next]
    paths:
      - .github/workflows/upgrade-electron-once.yml

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      ONNXRUNTIME_NODE_INSTALL: 'skip'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: architecture/fototo-next
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - name: Update Electron and regenerate the lockfile
        run: npm install --save-dev electron@45.3.1 --ignore-scripts --no-audit --no-fund
      - name: Document the new macOS minimum
        run: |
          node -e '
            const fs = require("node:fs");
            const file = "README.md";
            const source = fs.readFileSync(file, "utf8");
            const oldText = "macOS (Apple Silicon & Intel)";
            const newText = "macOS 13 Ventura or later (Apple Silicon & Intel)";
            if (!source.includes(oldText)) throw new Error("Expected macOS platform text was not found");
            fs.writeFileSync(file, source.replace(oldText, newText));
          '
      - name: Install locked dependencies
        run: npm ci
      - name: Verify Electron version
        run: |
          node -e "const v=require('electron/package.json').version; if(v!=='45.3.1') throw new Error('Unexpected Electron '+v); console.log('Electron '+v)"
          npm ls electron --depth=0
      - name: Report npm audit
        shell: bash
        run: |
          npm audit --json > "$RUNNER_TEMP/npm-audit.json" || true
          node -e '
            const fs = require("node:fs");
            const report = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            for (const [name, item] of Object.entries(report.vulnerabilities || {})) {
              const via = (item.via || []).map(v => typeof v === "string" ? v : v.title).join("; ");
              console.log(`${item.severity.toUpperCase()} ${name}@${item.range} direct=${item.isDirect} fix=${JSON.stringify(item.fixAvailable)} advisories=${via}`);
            }
            console.log("Audit totals: " + JSON.stringify(report.metadata?.vulnerabilities || {}));
          ' "$RUNNER_TEMP/npm-audit.json"
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run dist:dir
      - name: Check patch formatting
        run: git diff --check
      - name: Commit verified dependency update and remove this one-time workflow
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/upgrade-electron-once.yml
          git add package.json package-lock.json README.md
          git commit -m "security: upgrade Electron to 45.3.1"
          AUTH="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:architecture/fototo-next
