name: CI

on:
  push:
    branches: [main, 'architecture/**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      ONNXRUNTIME_NODE_INSTALL: 'skip'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Report dependency vulnerabilities
        shell: bash
        run: |
          npm audit --json > "$RUNNER_TEMP/npm-audit.json" || true
          node -e '
            const fs = require("node:fs");
            const report = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const vulns = report.vulnerabilities || {};
            for (const [name, item] of Object.entries(vulns)) {
              const via = (item.via || []).map(v => typeof v === "string" ? v : v.title).join("; ");
              console.log(item.severity.toUpperCase() + " " + name + "@" + item.range + " direct=" + item.isDirect + " fix=" + JSON.stringify(item.fixAvailable) + " advisories=" + via);
            }
            console.log("Audit totals: " + JSON.stringify(report.metadata?.vulnerabilities || {}));
          ' "$RUNNER_TEMP/npm-audit.json"
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  package:
    name: Package (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            target: nsis
          - os: macos-latest
            platform: mac
            target: dmg
          - os: ubuntu-latest
            platform: linux
            target: AppImage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Install the real platform-specific ONNX Runtime native binary.
      - run: npm ci
      - name: Build application
        run: npm run build
      - name: Download model and run native ONNX inference smoke test
        run: node --test tests/model-runtime.test.cjs
      - name: Create unsigned CI-only packaging configuration
        shell: bash
        run: |
          node -e '
            const fs = require("node:fs");
            const path = require("node:path");
            const config = structuredClone(require("./package.json").build);
            config.win = { ...config.win, forceCodeSigning: false };
            config.mac = { ...config.mac, forceCodeSigning: false, notarize: false };
            fs.writeFileSync(path.join(process.env.RUNNER_TEMP, "fototo-ci-builder.json"), JSON.stringify(config, null, 2));
          '
      - name: Build unsigned platform package
        shell: bash
        run: npx electron-builder --${{ matrix.platform }} ${{ matrix.target }} --publish never --config "$RUNNER_TEMP/fototo-ci-builder.json"
