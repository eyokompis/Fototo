name: Refresh Electron lockfile

on:
  push:
    branches: [architecture/fototo-next]
    paths:
      - package.json
      - .github/workflows/refresh-electron-lockfile.yml

permissions:
  contents: write

jobs:
  refresh-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: architecture/fototo-next
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - name: Regenerate lockfile using npm
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install from regenerated lockfile
        run: npm ci
        env:
          ONNXRUNTIME_NODE_INSTALL: skip
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run dist:dir
      - name: Report remaining dependency vulnerabilities
        shell: bash
        run: |
          npm audit --json > "$RUNNER_TEMP/npm-audit.json" || true
          node -e '
            const fs = require("node:fs");
            const report = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            for (const [name, item] of Object.entries(report.vulnerabilities || {})) {
              console.log(`${item.severity.toUpperCase()} ${name}@${item.range} direct=${item.isDirect} fix=${JSON.stringify(item.fixAvailable)}`);
            }
            console.log(`Audit totals: ${JSON.stringify(report.metadata?.vulnerabilities || {})}`);
          ' "$RUNNER_TEMP/npm-audit.json"
      - name: Commit regenerated lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: refresh lockfile for Electron 45"
          git push origin HEAD:architecture/fototo-next
