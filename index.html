<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>fototo</title>
  </head>
  <body>
    <header>
      <h1>fototo</h1>
      <span id="file-name"></span>
      <div class="actions">
        <button id="open-btn" type="button">Open photo</button>
        <button id="save-btn" type="button" disabled>Save</button>
        <button id="reset-btn" type="button" disabled>Reset</button>
        <button id="upscale-btn" type="button" disabled>Upscale 4× (AI)</button>
        <button id="enhance-btn" type="button" disabled>Enhance light (AI)</button>
        <span id="status"></span>
      </div>
    </header>
    <main>
      <div id="empty-state">
        <p>Open a photo to start editing. Everything stays on your machine.</p>
        <div id="recents" hidden>
          <h2>Recent photos</h2>
          <div id="recents-grid"></div>
        </div>
      </div>
      <canvas id="canvas" hidden></canvas>
    </main>
    <aside id="controls" hidden>
      <label>
        Exposure <span class="value"></span>
        <input id="exposure" type="range" min="-2" max="2" step="0.01" value="0" />
      </label>
      <label>
        Contrast
        <input id="contrast" type="range" min="0.5" max="1.8" step="0.01" value="1" />
      </label>
      <label>
        Saturation
        <input id="saturation" type="range" min="0" max="2" step="0.01" value="1" />
      </label>
      <label>
        Temperature
        <input id="temperature" type="range" min="-0.5" max="0.5" step="0.01" value="0" />
      </label>
    </aside>
    <script type="module" src="/src/renderer/main.ts"></script>
  </body>
</html>
